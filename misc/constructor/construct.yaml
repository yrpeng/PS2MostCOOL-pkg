name: PowerSynth2
version: {{ environ["PSVers"] }}
company: University of Arkansas

channels:
  - http://repo.anaconda.com/pkgs/main
  - https://conda.anaconda.org/conda-forge
specs:
  - python 3.10*
  - pip
  - git
  - networkx
  - joblib
  - seaborn
  - numpy 2.1*
  - pandas
  - scipy
  - matplotlib-base
  - pyyaml
  - deap
  - numba
  - pydoe2
  - pykrige
  - psutil
  - pyside6
  - fluidfoam
  - numpy-stl
  
license_file: gpl-3.0.txt # [not unix]

default_prefix: {{ environ["HOME"] }}/PowerSynth2 # [unix]
default_prefix: {{ environ["USERPROFILE"] }}\PowerSynth2 # [win]

script_env_variables:
  pyvers: "3.10"

  #gitbranch: "v2.1"
  gitoption: ""

  #for MostCOOL only:
  #MatlabRoot: /e3da/dev/sdk/linux/matlab/R2022b # [unix]
  
  gitorigin: https://github.com/yrpeng/PS2MostCOOL-
  gitbranch: dev


post_install: post_install.sh # [unix]
post_install: post_install.bat # [win]

register_python: false # [win]
icon_image: PS2.png # [win]